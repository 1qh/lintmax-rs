name: CI
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ci:
    runs-on: ${{ vars.RUNNER_LABEL }}
    steps:
      - name: own this run's cargo dirs (a shared home lets one run delete another's binaries)
        run: |
          echo "CARGO_HOME=${RUNNER_TEMP}/cargo-home" >> "${GITHUB_ENV}"
          echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/cargo-target" >> "${GITHUB_ENV}"
      - name: wipe workspace (leftover-file leakage between runs on shared runner)
        run: rm -rf "${GITHUB_WORKSPACE:?}/".[!.]* "${GITHUB_WORKSPACE:?}/"* 2>/dev/null || true
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-machete,dprint,typos-cli,ripgrep,shellcheck,shfmt
      - run: cargo install --path . --root "${CARGO_HOME}"
      - name: put the run-owned cargo bin on PATH (the gate is a cargo subcommand there)
        run: echo "${CARGO_HOME}/bin" >> "${GITHUB_PATH}"
      - run: cargo lintmax check
  prune-history:
    needs: [ci]
    runs-on: ${{ vars.RUNNER_LABEL }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: wipe workspace (leftover-file leakage between runs on shared runner)
        run: rm -rf "${GITHUB_WORKSPACE:?}/".[!.]* "${GITHUB_WORKSPACE:?}/"* 2>/dev/null || true
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: prune all prior CI runs (single-present-run discipline)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP_RUN_ID: ${{ github.run_id }}
        run: .github/scripts/prune-ci-runs.sh
